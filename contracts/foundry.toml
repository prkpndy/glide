[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 700
via_ir = true
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[rpc_endpoints]
unichain = "${UNICHAIN_RPC_URL}"
base = "${BASE_RPC_URL}"

[lint]
exclude_lints = ["unsafe-typecast", "screaming-snake-case-const", "mixed-case-function", "mixed-case-variable"]

# Uniswap v4 PoolManager pins solc 0.8.26 and does not compile under via_ir, so it is built separately with
# v4-core's own settings:  FOUNDRY_PROFILE=v4 forge build   -> out-v4/PoolManager.sol/PoolManager.json
# Tests load that artifact by path (see test/utils/V4Artifacts.sol).
[profile.v4]
src = "lib/v4-periphery/lib/v4-core/src"
test = "lib/v4-periphery/lib/v4-core/nonexistent"
script = "lib/v4-periphery/lib/v4-core/nonexistent"
out = "out-v4"
via_ir = false
optimizer = true
optimizer_runs = 44444444
evm_version = "cancun"
