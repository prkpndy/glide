[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 700
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

[fuzz]
runs = 256

[rpc_endpoints]
unichain = "${UNICHAIN_RPC_URL}"
base = "${BASE_RPC_URL}"

[lint]
exclude_lints = ["unsafe-typecast", "screaming-snake-case-const", "mixed-case-function", "mixed-case-variable"]
